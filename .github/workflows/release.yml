# Runs when a version tag (v1.2.3) is pushed. Two independent publications,
# both authenticated with GitHub OIDC, so no token or key is stored in this
# repository:
#
# 1. npm, through npm trusted publishing. npm generates provenance
#    automatically for a public package published this way from a public
#    repository, so package.json does not set publishConfig.provenance.
# 2. The official MCP Registry (registry.modelcontextprotocol.io): server.json
#    is published with mcp-publisher after the npm step. The registry only
#    stores metadata and checks that the npm package of that version exists
#    and that its package.json "mcpName" equals the "name" in server.json.
#    `mcp-publisher login github-oidc` grants the io.github.allswapio/*
#    namespace (the repository owner's namespace) to this workflow.
#
# First npm release: npm can only add a trusted publisher to a package that
# already exists on the registry. Version 1.0.0 was therefore published once by
# a maintainer from a clean checkout of the v1.0.0 tag, with 2FA:
#
#     npm test
#     npm publish --access public      # npm asks for the one-time password
#
# (no provenance is attached to that version). Then, on npmjs.com, the
# maintainer adds a trusted publisher for this package (GitHub Actions,
# organisation "allswapio", this repository, workflow file "release.yml", no
# environment), or runs `npm trust github <package> --file release.yml
# --repo allswapio/<repository> --allow-publish` with npm 11.15.0 or later.
# A new trusted publisher must be used within 2 days, so it is added when the
# next version is ready. From the next version on, this workflow publishes.
#
# Each publication is skipped on its own when the tagged version is already
# there, so a rerun after a partial failure finishes the missing part:
# - npm already has the version (for example the hand-published 1.0.0): the
#   npm publish step is skipped; the registry steps still run.
# - The registry already has the version (published versions are immutable):
#   the registry steps are skipped.
# - npm publish fails: the job stops there and the registry is not touched
#   (it would reject a version that is not on npm).
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # OIDC: npm trusted publishing and `mcp-publisher login github-oidc`

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # Pinned deliberately (the registry documentation asks for a pinned
      # release, never releases/latest). v1.8.16 is the version the production
      # registry reported at /v0.1/version when this was written. Update it on
      # purpose; the download below is verified against this exact tag.
      MCP_PUBLISHER_VERSION: v1.8.16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Trusted publishing needs npm >= 11.5.1 and Node >= 22.14.0; Node 24 ships a compatible npm.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Check that the tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi
      - run: npm --version
      # The tests also check that server.json, package.json and the server agree on the name and version.
      - run: npm test

      # ---- npm ----
      - name: Check whether this version is already on npm
        id: published
        run: |
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "${name}@${version} is already on npm; nothing to publish."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi
      - run: npm publish
        if: steps.published.outputs.already != 'true'

      # ---- MCP Registry (independent of whether the npm step published) ----
      - name: Check whether this version is already in the MCP Registry
        id: registry
        run: |
          set -euo pipefail
          name="$(node -p 'require("./server.json").name')"
          version="$(node -p 'require("./server.json").version')"
          url="https://registry.modelcontextprotocol.io/v0.1/servers/$(node -p 'encodeURIComponent(process.argv[1])' "${name}")/versions/$(node -p 'encodeURIComponent(process.argv[1])' "${version}")?include_deleted=true"
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 30 "${url}")"
          case "${status}" in
            200)
              echo "already=true" >> "$GITHUB_OUTPUT"
              echo "${name} ${version} is already in the MCP Registry; nothing to publish."
              ;;
            404)
              echo "already=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unexpected HTTP ${status} from ${url}" >&2
              exit 1
              ;;
          esac
      - name: Wait until npm serves this version with its mcpName
        if: steps.registry.outputs.already != 'true'
        run: |
          set -euo pipefail
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          expected="$(node -p 'require("./server.json").name')"
          for attempt in $(seq 1 120); do
            actual="$(npm view "${name}@${version}" mcpName 2>/dev/null || true)"
            if [ "${actual}" = "${expected}" ]; then
              echo "npm serves ${name}@${version} with mcpName ${actual}."
              exit 0
            fi
            echo "Attempt ${attempt}: npm reports mcpName '${actual}'; waiting."
            sleep 10
          done
          echo "npm does not serve ${name}@${version} with mcpName ${expected}" >&2
          exit 1
      - name: Install cosign
        if: steps.registry.outputs.already != 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        if: steps.registry.outputs.already != 'true'
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"

          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - name: Authenticate to the MCP Registry
        if: steps.registry.outputs.already != 'true'
        run: ./mcp-publisher login github-oidc
      - name: Publish server.json to the MCP Registry
        if: steps.registry.outputs.already != 'true'
        run: ./mcp-publisher publish
